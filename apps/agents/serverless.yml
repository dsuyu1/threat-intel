service: threat-intel-agents

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 512
  timeout: 300 # 5 min max - agents can be slow on large CVE pages
  environment:
    DATABASE_URL: ${ssm:/threat-intel/DATABASE_URL}
    OPENAI_API_KEY: ${ssm:/threat-intel/OPENAI_API_KEY}
    TI_SECRETS_KEY: ${ssm:/threat-intel/TI_SECRETS_KEY}
    AGENTS_ON_DEMAND_SECRET: ${ssm:/threat-intel/AGENTS_ON_DEMAND_SECRET}
    NVD_API_KEY: ${ssm:/threat-intel/NVD_API_KEY}
    GITHUB_TOKEN: ${ssm:/threat-intel/GITHUB_TOKEN}
    MALWAREBAZAAR_API_KEY: ${ssm:/threat-intel/MALWAREBAZAAR_API_KEY}
    ANYRUN_API_KEY: ${ssm:/threat-intel/ANYRUN_API_KEY}
  iam:
    role:
      statements:
        # Allow reading secrets from SSM Parameter Store
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:us-east-1:*:parameter/threat-intel/*
        # Allow Bedrock inference (if you switch from OpenAI to Bedrock later)
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: "*"
        # Allow the HTTP enqueue function to invoke the on-demand runner asynchronously.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${sls:stage}-onDemandAgentRunner*

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false       # keep readable for debugging
    sourcemap: true
    target: node20
    platform: node
    format: esm
    # Externals: don't bundle these - they're native or too large
    external:
      - "@neondatabase/serverless"
    outputFileExtension: .mjs

functions:

  vulnAgent:
    handler: src/handlers/vuln.handler
    description: "Fetches CVEs from NVD + CISA KEV, AI-summarizes, writes to DB"
    events:
      - schedule:
          rate: rate(6 hours)
          enabled: true
          name: vuln-agent-schedule
          description: "Run VulnAgent every 6 hours"

  vulnScannerAgent:
    handler: src/handlers/vuln-scanners.handler
    description: "Syncs Tenable/Qualys/Rapid7 scan results and caches per-CVE exposure"
    events:
      - schedule:
          rate: rate(6 hours)
          enabled: true
          name: vuln-scanner-agent-schedule

  exploitAgent:
    handler: src/handlers/exploit.handler
    description: "Scans GitHub + ExploitDB for new PoCs, tracks time-to-exploit"
    events:
      - schedule:
          rate: rate(2 hours)
          enabled: true
          name: exploit-agent-schedule

  attackAgent:
    handler: src/handlers/attack.handler
    description: "Monitors threat intel RSS feeds, CISA alerts, FBI Flash reports"
    events:
      - schedule:
          rate: rate(4 hours)
          enabled: true
          name: attack-agent-schedule

  ttpAgent:
    handler: src/handlers/ttp.handler
    description: "Diffs MITRE ATT&CK STIX bundle for new/updated techniques"
    events:
      - schedule:
          rate: cron(0 6 ? * SUN *)  # weekly at 06:00 UTC (Sunday)
          enabled: true
          name: ttp-agent-schedule

  actorProfileAgent:
    handler: src/handlers/profile.handler
    description: "Builds actor profiles + neighbors (offline similarity)"
    events:
      - schedule:
          rate: cron(30 6 * * ? *)  # daily at 06:30 UTC
          enabled: true
          name: actor-profile-agent-schedule

  navigatorAgent:
    handler: src/handlers/navigator.handler
    description: "Recomputes Navigator scenarios for Pro users"
    events:
      - schedule:
          rate: cron(0 7 * * ? *)  # daily at 07:00 UTC
          enabled: true
          name: navigator-agent-schedule

  epssEnrichAgent:
    handler: src/handlers/epss-enrich.handler
    description: "Enriches CVE findings with EPSS probability scores"
    events:
      - schedule:
          rate: cron(30 7 * * ? *)  # daily at 07:30 UTC
          enabled: true
          name: epss-enrich-agent-schedule

  detectionsAgent:
    handler: src/handlers/detections.handler
    description: "Drains Navigator detection jobs and caches Sigma/KQL/SPL detections"
    events:
      - schedule:
          rate: rate(15 minutes)
          enabled: true
          name: detections-agent-schedule

  thehiveSyncAgent:
    handler: src/handlers/thehive.handler
    description: "Syncs TheHive cases into incidents for MTTD/MTTR/containment metrics"
    events:
      - schedule:
          rate: rate(15 minutes)
          enabled: true
          name: thehive-sync-agent-schedule

  customAgentRunner:
    handler: src/handlers/custom.handler
    description: "Runs user-defined agents (prompt + skill blocks) on a schedule"
    events:
      - schedule:
          rate: rate(30 minutes)
          enabled: true
          name: custom-agent-runner-schedule

  iocTaxiiImportAgent:
    handler: src/handlers/ioc-taxii.handler
    description: "Imports IOCs from TAXII 2.1 feeds into iocs/ioc_sources"
    events:
      - schedule:
          rate: rate(30 minutes)
          enabled: true
          name: ioc-taxii-agent-schedule

  iocEnrichAgent:
    handler: src/handlers/ioc-enrich.handler
    description: "Drains IOC enrichment jobs (VirusTotal/Shodan)"
    events:
      - schedule:
          rate: rate(10 minutes)
          enabled: true
          name: ioc-enrich-agent-schedule

  mergeAgent:
    handler: src/handlers/merge.handler
    description: "Applies accepted entity merge candidates (manual trigger)"

  malwareAgent:
    handler: src/handlers/malware.handler
    description: "Pulls new malware samples from MalwareBazaar + Any.run"
    events:
      - schedule:
          rate: rate(12 hours)
          enabled: true
          name: malware-agent-schedule

  onDemandAgentRunner:
    handler: src/handlers/on-demand.handler
    description: "Runs system/custom agents on-demand (invoked by the web app)"

  onDemandEnqueue:
    handler: src/handlers/on-demand-enqueue.handler
    description: "HTTP endpoint that validates a shared secret and enqueues on-demand agent runs"
    timeout: 10
    memorySize: 128
    environment:
      ON_DEMAND_RUNNER_FUNCTION_NAME: ${self:service}-${sls:stage}-onDemandAgentRunner
    events:
      - httpApi:
          path: /on-demand
          method: post
