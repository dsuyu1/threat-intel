service: threat-intel-agents

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 512
  timeout: 300 # 5 min max — agents can be slow on large CVE pages
  environment:
    DATABASE_URL: ${ssm:/threat-intel/DATABASE_URL}
    OPENAI_API_KEY: ${ssm:/threat-intel/OPENAI_API_KEY}
    NVD_API_KEY: ${ssm:/threat-intel/NVD_API_KEY}
  iam:
    role:
      statements:
        # Allow reading secrets from SSM Parameter Store
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:us-east-1:*:parameter/threat-intel/*
        # Allow Bedrock inference (if you switch from OpenAI to Bedrock later)
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: "*"

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false       # keep readable for debugging
    sourcemap: true
    target: node20
    platform: node
    format: esm
    # Externals: don't bundle these — they're native or too large
    external:
      - "@neondatabase/serverless"
    outputFileExtension: .mjs

functions:

  vulnAgent:
    handler: src/handlers/vuln.handler
    description: "Fetches CVEs from NVD + CISA KEV, AI-summarizes, writes to DB"
    events:
      - schedule:
          rate: rate(6 hours)
          enabled: true
          name: vuln-agent-schedule
          description: "Run VulnAgent every 6 hours"

  exploitAgent:
    handler: src/handlers/exploit.handler
    description: "Scans GitHub + ExploitDB for new PoCs, tracks time-to-exploit"
    events:
      - schedule:
          rate: rate(2 hours)
          enabled: true
          name: exploit-agent-schedule

  attackAgent:
    handler: src/handlers/attack.handler
    description: "Monitors threat intel RSS feeds, CISA alerts, FBI Flash reports"
    events:
      - schedule:
          rate: rate(4 hours)
          enabled: true
          name: attack-agent-schedule

  ttpAgent:
    handler: src/handlers/ttp.handler
    description: "Diffs MITRE ATT&CK STIX bundle for new/updated techniques"
    events:
      - schedule:
          rate: cron(0 6 * * ? *)  # daily at 06:00 UTC
          enabled: true
          name: ttp-agent-schedule

  malwareAgent:
    handler: src/handlers/malware.handler
    description: "Pulls new malware samples from MalwareBazaar + Any.run"
    events:
      - schedule:
          rate: rate(12 hours)
          enabled: true
          name: malware-agent-schedule
